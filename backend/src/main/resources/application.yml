spring:
  application:
    name: eventflow
  profiles:
    default: local
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

eventflow:
  security:
    jwt:
      issuer: ${EVENTFLOW_JWT_ISSUER:eventflow}
      secret: ${EVENTFLOW_JWT_SECRET:}
      access-token-ttl: PT30M
      refresh-token-ttl: P7D
  storage:
    avatar-directory: ${EVENTFLOW_AVATAR_DIRECTORY:uploads/avatars}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

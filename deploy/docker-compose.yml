services:
  mysql:
    image: mysql:8.4
    container_name: eventflow-mysql
    environment:
      MYSQL_DATABASE: eventflow
      MYSQL_USER: eventflow
      MYSQL_PASSWORD: ${EVENTFLOW_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EVENTFLOW_DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${EVENTFLOW_DB_PORT:-3306}:3306"
    volumes:
      - eventflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${EVENTFLOW_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: eventflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - eventflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: eventflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: eventflow
      RABBITMQ_DEFAULT_PASS: ${EVENTFLOW_RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - eventflow-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  eventflow-mysql-data:
  eventflow-redis-data:
  eventflow-rabbitmq-data:
